<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Yggdrasil Diff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --accent: #4670ff;
      --accent-soft: rgba(70, 112, 255, 0.14);
      --add: #2ea043;
      --add-bg: rgba(46, 160, 67, 0.14);
      --del: #cf3838;
      --del-bg: rgba(207, 56, 56, 0.13);
    }

    [data-theme="dark"] {
      --bg-pane: #181b21;
      --bg-pane-soft: #1d2128;
      --bg-elev: #232730;
      --bg-hover: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.13);
      --text: #e8eaef;
      --text-dim: #a4abb8;
      --text-mute: #6b7384;
      --text-faint: #4a5161;
      --diff-add-fg: #b7eccb;
      --diff-del-fg: #f5b8b8;
      --diff-context: #c4cad6;
      --diff-gutter: #5b6273;
      /* Syntax */
      --syn-kw: #ff7a99;
      --syn-ty: #67d4ce;
      --syn-fn: #a4baff;
      --syn-str: #e0c374;
      --syn-num: #c794ff;
      --syn-com: #6b7384;
    }

    [data-theme="light"] {
      --bg-pane: #fbf8f2;
      --bg-pane-soft: #f0ece2;
      --bg-elev: #ffffff;
      --bg-hover: rgba(0, 0, 0, 0.035);
      --border: rgba(60, 50, 30, 0.10);
      --border-strong: rgba(60, 50, 30, 0.18);
      --text: #1a1814;
      --text-dim: #5a5448;
      --text-mute: #8a8474;
      --text-faint: #b3ad9b;
      --diff-add-fg: #1a4730;
      --diff-del-fg: #6b1717;
      --diff-context: #3a3528;
      --diff-gutter: #a09a87;
      --syn-kw: #c92879;
      --syn-ty: #0f7a72;
      --syn-fn: #2855c8;
      --syn-str: #8c5a00;
      --syn-num: #7a36b3;
      --syn-com: #8a8474;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-sans);
      font-feature-settings: "ss01", "ss02", "cv11";
      font-size: 12px;
      color: var(--text);
      background: var(--bg-pane);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }
    ::selection { background: var(--accent-soft); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 8px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: padding-box; }
    button { font-family: inherit; }
    button:focus { outline: none; }

    /* --- Layout ------------------------------------------------------ */
    #root {
      display: flex; height: 100vh; overflow: hidden;
      background: var(--bg-pane);
    }

    /* File tree */
    #sidebar {
      width: 220px; flex-shrink: 0;
      border-right: 0.5px solid var(--border);
      background: var(--bg-pane-soft);
      display: flex; flex-direction: column;
    }
    #sidebar-header {
      padding: 12px 14px 10px;
      border-bottom: 0.5px solid var(--border);
    }
    #sidebar-header .label {
      font-size: 10.5px; font-weight: 600;
      color: var(--text-mute);
      letter-spacing: 1px; text-transform: uppercase;
    }
    #sidebar-header .totals {
      display: flex; align-items: baseline; gap: 8px; margin-top: 4px;
    }
    #sidebar-header .count {
      font-size: 18px; font-weight: 600;
      color: var(--text); letter-spacing: -0.4px;
    }
    #sidebar-header .add,
    #sidebar-header .del {
      font-family: var(--font-mono); font-size: 11px;
    }
    #sidebar-header .add { color: var(--add); }
    #sidebar-header .del { color: var(--del); }
    #tree {
      flex: 1; overflow-y: auto;
      padding: 6px 0;
    }
    .tree-node {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 8px;
      background: transparent; border: none;
      width: 100%; text-align: left;
      cursor: pointer; color: var(--text-dim);
      font-size: 12px; font-family: var(--font-sans);
    }
    .tree-node:hover { background: var(--bg-hover); }
    .tree-node .chev { opacity: 0.5; flex-shrink: 0; }
    .tree-node .ico { color: var(--text-mute); flex-shrink: 0; }
    .tree-file {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 8px;
      background: transparent; border: none;
      border-left: 2px solid transparent;
      width: 100%; text-align: left;
      cursor: pointer; color: var(--text);
      font-size: 12px; font-family: var(--font-sans);
    }
    .tree-file.selected {
      background: var(--accent-soft);
      color: var(--accent);
      border-left-color: var(--accent);
    }
    .tree-file:hover:not(.selected) { background: var(--bg-hover); }
    .tree-file .status-dot {
      width: 6px; height: 6px; border-radius: 1px; flex-shrink: 0;
    }
    .tree-file .status-dot.added { background: var(--add); }
    .tree-file .status-dot.deleted { background: var(--del); }
    .tree-file .status-dot.modified { background: var(--accent); }
    .tree-file .name {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: var(--font-mono); font-size: 11.5px;
      letter-spacing: -0.1px;
    }
    .tree-file .add,
    .tree-file .del {
      font-size: 10px; font-family: var(--font-mono);
      letter-spacing: 0.2px;
    }
    .tree-file .add { color: var(--add); }
    .tree-file .del { color: var(--del); }

    /* Right pane */
    #content {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
    }
    #toolbar {
      height: 38px; display: flex; align-items: center;
      padding: 0 12px; gap: 8px;
      border-bottom: 0.5px solid var(--border);
      background: var(--bg-pane);
    }
    #toolbar .branch {
      display: flex; align-items: center; gap: 7px;
      font-size: 10.5px; color: var(--text-mute);
      font-family: var(--font-mono);
      min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    #toolbar .branch .accent { color: var(--text-dim); }
    #toolbar .branch .arrow { color: var(--text-faint); margin: 0 2px; }
    #toolbar .modes {
      display: flex; padding: 2px;
      background: var(--bg-pane-soft);
      border: 0.5px solid var(--border);
      border-radius: 7px;
      flex-shrink: 0;
    }
    #toolbar .modes button {
      padding: 3px 9px; font-size: 11px; font-weight: 500;
      color: var(--text-mute);
      background: transparent; border: none;
      border-radius: 5px; cursor: pointer;
      font-family: var(--font-sans);
      text-transform: capitalize;
    }
    #toolbar .modes button.active {
      color: var(--text); background: var(--bg-elev);
      font-weight: 600;
      box-shadow: 0 0.5px 2px rgba(0, 0, 0, 0.1);
    }
    #files {
      flex: 1; overflow-y: auto;
      padding: 14px;
    }
    #empty {
      padding: 64px 24px; text-align: center;
      color: var(--text-mute); font-size: 13px;
    }

    /* File card */
    .file {
      border-radius: 8px; overflow: hidden;
      border: 0.5px solid var(--border);
      background: var(--bg-pane);
      margin-bottom: 14px;
    }
    .file-header {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 12px;
      background: var(--bg-pane-soft);
      border-bottom: 0.5px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .file.collapsed .file-header { border-bottom: none; }
    .file-header .chev { color: var(--text-dim); flex-shrink: 0; }
    .file-header .ico { color: var(--text-mute); flex-shrink: 0; }
    .file-header .path {
      font-family: var(--font-mono); font-size: 12px;
      color: var(--text); letter-spacing: -0.1px;
      flex-shrink: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-header .status {
      padding: 1px 6px; border-radius: 3px;
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.4px;
      text-transform: uppercase;
      font-family: var(--font-mono);
      flex-shrink: 0;
    }
    .file-header .status.added {
      background: color-mix(in srgb, var(--add) 18%, transparent);
      color: var(--add);
    }
    .file-header .status.deleted {
      background: color-mix(in srgb, var(--del) 18%, transparent);
      color: var(--del);
    }
    .file-header .status.modified {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .file-header .spacer { flex: 1; }
    .file-header .counts {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 11px;
      flex-shrink: 0;
    }
    .file-header .counts .add { color: var(--add); }
    .file-header .counts .del { color: var(--del); }
    .diff-bar {
      display: flex; gap: 2px; align-items: center;
    }
    .diff-bar .seg {
      width: 7px; height: 7px; border-radius: 1px;
      background: var(--border-strong);
    }
    .diff-bar .seg.add { background: var(--add); }
    .diff-bar .seg.del { background: var(--del); }

    /* Hunk + rows */
    .hunk-header {
      background: var(--bg-pane-soft);
      border-top: 0.5px solid var(--border);
      border-bottom: 0.5px solid var(--border);
      height: 24px;
      display: flex; align-items: center;
      padding-left: 8px;
      color: var(--text-mute);
      font-size: 11px; font-family: var(--font-mono);
    }
    .hunk-header:first-child { border-top: none; }
    .row {
      display: flex;
      min-height: 20px; line-height: 20px;
      font-family: var(--font-mono); font-size: 11.5px;
    }
    .row.add { background: var(--add-bg); }
    .row.del { background: var(--del-bg); }
    .gutter {
      width: 48px; padding: 0 8px;
      text-align: right;
      color: var(--diff-gutter); font-size: 10.5px;
      user-select: none; flex-shrink: 0;
      border-right: 0.5px solid var(--border);
    }
    .gutter.empty { background: var(--bg-pane-soft); }
    .prefix {
      width: 18px; text-align: center;
      font-weight: 600; flex-shrink: 0; user-select: none;
    }
    .prefix.add { color: var(--add); }
    .prefix.del { color: var(--del); }
    .prefix.ctx { color: var(--diff-gutter); }
    .content {
      flex: 1; padding-right: 12px; white-space: pre;
      overflow-x: auto;
      color: var(--diff-context);
    }
    .row.add .content { color: var(--diff-add-fg); }
    .row.del .content { color: var(--diff-del-fg); }

    /* Side-by-side: two columns inside the body */
    .row.side {
      display: flex;
    }
    .row.side .side {
      flex: 1; min-width: 0;
      display: flex;
      border-right: 0.5px solid var(--border);
    }
    .row.side .side:last-child { border-right: none; }
    .row.side .side.empty {
      background: var(--bg-pane-soft);
    }
    .row.side .side.add { background: var(--add-bg); }
    .row.side .side.del { background: var(--del-bg); }

    /* Syntax highlight spans */
    .syn-kw { color: var(--syn-kw); }
    .syn-ty { color: var(--syn-ty); }
    .syn-fn { color: var(--syn-fn); }
    .syn-str { color: var(--syn-str); }
    .syn-num { color: var(--syn-num); }
    .syn-com { color: var(--syn-com); }
  </style>
</head>
<body data-theme="dark">
  <div id="root">
    <aside id="sidebar">
      <div id="sidebar-header">
        <div class="label">Files changed</div>
        <div class="totals">
          <span class="count" id="file-count">0</span>
          <span class="add" id="total-add">+0</span>
          <span class="del" id="total-del">−0</span>
        </div>
      </div>
      <div id="tree"></div>
    </aside>
    <main id="content">
      <div id="toolbar">
        <div class="modes" id="scope-modes" style="display:none">
          <button id="btn-scope-branch" class="active" title="Everything that distinguishes this branch from its base">branch</button>
          <button id="btn-scope-uncommitted" title="Uncommitted working-tree changes (vs HEAD)">uncommitted</button>
        </div>
        <div style="flex:1"></div>
        <div class="modes">
          <button id="btn-side" class="active">split</button>
          <button id="btn-line">unified</button>
        </div>
      </div>
      <div id="files">
        <div id="empty">No diff yet.</div>
      </div>
    </main>
  </div>

  <script>
    'use strict';

    // ---------------- Icons (inline SVG) -----------------------------
    const ICONS = {
      chevronRight: '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>',
      chevronDown: '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>',
      folder: '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5z"/></svg>',
      folderOpen: '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V7H2V5z"/><path d="M2 7h12l-1 5.2a1 1 0 0 1-1 0.8H4a1 1 0 0 1-1-0.8L2 7z"/></svg>',
      file: '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M4 2h6l3 3v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M10 2v3h3"/></svg>',
    };

    // ---------------- Parser -----------------------------------------
    function parseDiff(text) {
      const files = [];
      let cur = null;
      let hunk = null;
      let oldLn = 0, newLn = 0;
      const lines = text.split('\n');
      for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        if (l.startsWith('diff --git ')) {
          if (cur) files.push(cur);
          // 'diff --git a/<path> b/<path>'
          const m = l.match(/^diff --git a\/(.+) b\/(.+)$/);
          const path = m ? m[2] : l.slice('diff --git '.length);
          cur = {
            path: path, status: 'modified',
            add: 0, del: 0, hunks: [], lang: detectLang(path),
          };
          hunk = null;
          continue;
        }
        if (!cur) continue;
        if (l.startsWith('--- ')) {
          if (l === '--- /dev/null') cur.status = 'added';
          continue;
        }
        if (l.startsWith('+++ ')) {
          if (l === '+++ /dev/null') cur.status = 'deleted';
          continue;
        }
        if (l.startsWith('@@ ')) {
          const m = l.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*)$/);
          if (m) {
            oldLn = parseInt(m[1], 10);
            newLn = parseInt(m[2], 10);
            hunk = { header: l, lines: [] };
            cur.hunks.push(hunk);
          }
          continue;
        }
        if (!hunk) continue;
        const tag = l[0];
        if (tag === '+') {
          hunk.lines.push({ type: 'add', n: newLn++, text: l.slice(1) });
          cur.add++;
        } else if (tag === '-') {
          hunk.lines.push({ type: 'del', n: oldLn++, text: l.slice(1) });
          cur.del++;
        } else if (tag === ' ') {
          hunk.lines.push({ type: 'ctx', n: newLn, oldN: oldLn, text: l.slice(1) });
          oldLn++; newLn++;
        } else if (tag === '\\') {
          // "\ No newline at end of file" — skip
        }
      }
      if (cur) files.push(cur);
      return files;
    }

    function detectLang(path) {
      const ext = (path.match(/\.([^./]+)$/) || [])[1] || '';
      return ext.toLowerCase();
    }

    // ---------------- Tree -------------------------------------------
    function buildTree(files) {
      const root = { name: '', children: {}, files: [] };
      for (const f of files) {
        const parts = f.path.split('/');
        let node = root;
        for (let i = 0; i < parts.length - 1; i++) {
          const p = parts[i];
          if (!node.children[p]) {
            node.children[p] = { name: p, children: {}, files: [] };
          }
          node = node.children[p];
        }
        node.files.push(f);
      }
      return root;
    }

    // ---------------- Highlight (Go only for now) --------------------
    const GO_KW = new Set(['func', 'package', 'import', 'if', 'else', 'for', 'return', 'var', 'const', 'type', 'struct', 'interface', 'range', 'go', 'defer', 'select', 'case', 'default', 'break', 'continue', 'switch', 'chan', 'map', 'fallthrough', 'goto', 'nil', 'true', 'false', 'make']);
    const GO_TY = new Set(['string', 'int', 'int32', 'int64', 'uint', 'uint32', 'uint64', 'byte', 'bool', 'error', 'context', 'rune', 'float32', 'float64']);

    function highlight(text, lang) {
      if (lang !== 'go' || !text) return escapeHtml(text || '');
      const parts = [];
      let i = 0;
      while (i < text.length) {
        const c = text[i];
        if (c === '"' || c === '`') {
          const q = c; let j = i + 1;
          while (j < text.length && text[j] !== q) {
            if (text[j] === '\\' && q === '"') j++;
            j++;
          }
          parts.push({ t: text.slice(i, Math.min(j + 1, text.length)), c: 'str' });
          i = j + 1; continue;
        }
        if (c === '/' && text[i + 1] === '/') {
          parts.push({ t: text.slice(i), c: 'com' });
          break;
        }
        if (/\s/.test(c)) {
          let j = i; while (j < text.length && /\s/.test(text[j])) j++;
          parts.push({ t: text.slice(i, j), c: null }); i = j; continue;
        }
        if (/[0-9]/.test(c)) {
          let j = i; while (j < text.length && /[0-9a-fxA-FX._]/.test(text[j])) j++;
          parts.push({ t: text.slice(i, j), c: 'num' }); i = j; continue;
        }
        if (/[a-zA-Z_]/.test(c)) {
          let j = i; while (j < text.length && /[a-zA-Z0-9_]/.test(text[j])) j++;
          const w = text.slice(i, j);
          let cl = 'id';
          if (GO_KW.has(w)) cl = 'kw';
          else if (GO_TY.has(w)) cl = 'ty';
          else if (/^[A-Z]/.test(w)) cl = 'ty';
          else if (text[j] === '(') cl = 'fn';
          parts.push({ t: w, c: cl }); i = j; continue;
        }
        let j = i; while (j < text.length && !/[a-zA-Z0-9_\s"`]/.test(text[j]) && text[j] !== '/') j++;
        if (j === i) j = i + 1;
        parts.push({ t: text.slice(i, j), c: 'op' }); i = j;
      }
      return parts.map(p => {
        const esc = escapeHtml(p.t);
        if (!p.c || p.c === 'op' || p.c === 'id') return esc;
        return `<span class="syn-${p.c}">${esc}</span>`;
      }).join('');
    }

    function escapeHtml(s) {
      return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
    }

    // ---------------- Render -----------------------------------------
    const state = {
      diff: [], tree: null,
      mode: 'split', // 'split' | 'unified'
      selected: null,
      collapsed: {},
      fileEls: {},
    };

    function render() {
      const treeEl = document.getElementById('tree');
      const filesEl = document.getElementById('files');
      const empty = document.getElementById('empty');

      const totalAdd = state.diff.reduce((s, f) => s + f.add, 0);
      const totalDel = state.diff.reduce((s, f) => s + f.del, 0);
      document.getElementById('file-count').textContent = state.diff.length;
      document.getElementById('total-add').textContent = '+' + totalAdd;
      document.getElementById('total-del').textContent = '−' + totalDel;

      if (state.diff.length === 0) {
        treeEl.innerHTML = '';
        filesEl.innerHTML = '';
        empty.style.display = '';
        filesEl.appendChild(empty);
        return;
      }
      empty.style.display = 'none';

      treeEl.innerHTML = '';
      renderTreeNode(treeEl, state.tree, 0);

      filesEl.innerHTML = '';
      state.fileEls = {};
      for (const f of state.diff) {
        const card = renderFileCard(f);
        state.fileEls[f.path] = card;
        filesEl.appendChild(card);
      }
    }

    function renderTreeNode(parent, node, depth) {
      for (const childName of Object.keys(node.children).sort()) {
        const child = node.children[childName];
        const btn = document.createElement('button');
        btn.className = 'tree-node';
        btn.style.paddingLeft = (depth * 12 + 8) + 'px';
        btn.innerHTML =
          `<span class="chev">${ICONS.chevronDown}</span>` +
          `<span class="ico">${ICONS.folderOpen}</span>` +
          `<span>${escapeHtml(child.name)}</span>`;
        parent.appendChild(btn);
        renderTreeNode(parent, child, depth + 1);
      }
      for (const f of node.files) {
        const btn = document.createElement('button');
        btn.className = 'tree-file';
        if (f.path === state.selected) btn.classList.add('selected');
        btn.style.paddingLeft = (depth * 12 + 8) + 'px';
        const basename = f.path.split('/').pop();
        btn.innerHTML =
          `<span class="status-dot ${f.status}"></span>` +
          `<span class="name">${escapeHtml(basename)}</span>` +
          `<span class="add">+${f.add}</span>` +
          `<span class="del">−${f.del}</span>`;
        btn.addEventListener('click', () => {
          state.selected = f.path;
          render();
          const el = state.fileEls[f.path];
          if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
        });
        parent.appendChild(btn);
      }
    }

    function renderFileCard(f) {
      const card = document.createElement('div');
      card.className = 'file';
      if (state.collapsed[f.path]) card.classList.add('collapsed');

      const header = document.createElement('div');
      header.className = 'file-header';
      header.innerHTML =
        `<span class="chev">${state.collapsed[f.path] ? ICONS.chevronRight : ICONS.chevronDown}</span>` +
        `<span class="ico">${ICONS.file}</span>` +
        `<span class="path">${escapeHtml(f.path)}</span>` +
        `<span class="status ${f.status}">${f.status}</span>` +
        `<span class="spacer"></span>` +
        `<span class="counts">` +
          `<span class="add">+${f.add}</span>` +
          `<span class="del">−${f.del}</span>` +
          renderDiffBar(f.add, f.del) +
        `</span>`;
      header.addEventListener('click', () => {
        state.collapsed[f.path] = !state.collapsed[f.path];
        render();
      });
      card.appendChild(header);

      if (!state.collapsed[f.path]) {
        for (const h of f.hunks) {
          const hh = document.createElement('div');
          hh.className = 'hunk-header';
          hh.textContent = h.header;
          card.appendChild(hh);
          const body = document.createElement('div');
          if (state.mode === 'unified') {
            for (const line of h.lines) body.appendChild(renderUnifiedRow(line, f.lang));
          } else {
            for (const row of pairForSplit(h.lines)) {
              body.appendChild(renderSplitRow(row, f.lang));
            }
          }
          card.appendChild(body);
        }
      }

      return card;
    }

    function renderDiffBar(add, del) {
      const total = Math.max(add + del, 1);
      const addSegs = Math.round((add / total) * 5);
      const delSegs = 5 - addSegs;
      let out = '<span class="diff-bar">';
      for (let i = 0; i < 5; i++) {
        const cls = i < addSegs ? 'add' : i < addSegs + delSegs ? 'del' : '';
        out += `<span class="seg ${cls}"></span>`;
      }
      out += '</span>';
      return out;
    }

    function renderUnifiedRow(line, lang) {
      const row = document.createElement('div');
      row.className = 'row ' + line.type;
      const prefix = line.type === 'add' ? '+' : line.type === 'del' ? '−' : ' ';
      const oldNum = line.type === 'del' ? line.n : line.type === 'ctx' ? line.oldN : '';
      const newNum = line.type === 'add' || line.type === 'ctx' ? line.n : '';
      row.innerHTML =
        `<span class="gutter">${oldNum}</span>` +
        `<span class="gutter">${newNum}</span>` +
        `<span class="prefix ${line.type}">${prefix}</span>` +
        `<span class="content">${highlight(line.text, lang)}</span>`;
      return row;
    }

    function pairForSplit(lines) {
      // Pair adjacent del/add blocks side-by-side. Context shows on both.
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const l = lines[i];
        if (l.type === 'ctx') {
          out.push({ left: l, right: l });
          i++;
        } else if (l.type === 'del') {
          const dels = [];
          while (i < lines.length && lines[i].type === 'del') { dels.push(lines[i]); i++; }
          const adds = [];
          while (i < lines.length && lines[i].type === 'add') { adds.push(lines[i]); i++; }
          const max = Math.max(dels.length, adds.length);
          for (let k = 0; k < max; k++) out.push({ left: dels[k] || null, right: adds[k] || null });
        } else if (l.type === 'add') {
          const adds = [];
          while (i < lines.length && lines[i].type === 'add') { adds.push(lines[i]); i++; }
          for (const a of adds) out.push({ left: null, right: a });
        } else {
          i++;
        }
      }
      return out;
    }

    function renderSplitRow(pair, lang) {
      const row = document.createElement('div');
      row.className = 'row side';
      row.appendChild(renderSplitSide(pair.left, 'del', lang));
      row.appendChild(renderSplitSide(pair.right, 'add', lang));
      return row;
    }

    function renderSplitSide(line, defaultType, lang) {
      const side = document.createElement('div');
      if (!line) {
        side.className = 'side empty';
        side.innerHTML =
          `<span class="gutter empty"></span>` +
          `<span class="prefix"></span>` +
          `<span class="content"></span>`;
        return side;
      }
      const t = line.type === 'ctx' ? 'ctx' : defaultType;
      side.className = 'side ' + t;
      const n = line.type === 'ctx'
        ? (defaultType === 'del' ? line.oldN : line.n)
        : line.n;
      const prefix = t === 'add' ? '+' : t === 'del' ? '−' : ' ';
      side.innerHTML =
        `<span class="gutter">${n}</span>` +
        `<span class="prefix ${t}">${prefix}</span>` +
        `<span class="content">${highlight(line.text, lang)}</span>`;
      return side;
    }

    // ---------------- Wiring -----------------------------------------
    const btnSide = document.getElementById('btn-side');
    const btnLine = document.getElementById('btn-line');
    btnSide.addEventListener('click', () => {
      state.mode = 'split';
      btnSide.classList.add('active');
      btnLine.classList.remove('active');
      render();
    });
    btnLine.addEventListener('click', () => {
      state.mode = 'unified';
      btnLine.classList.add('active');
      btnSide.classList.remove('active');
      render();
    });

    // Scope toggle (branch / uncommitted). Visibility + selection are
    // driven by Swift via window.yggdrasil.setScopeOptions; click events
    // bubble back to Swift via the userContentController bridge.
    const scopeModes = document.getElementById('scope-modes');
    const btnBranch = document.getElementById('btn-scope-branch');
    const btnUncommitted = document.getElementById('btn-scope-uncommitted');
    function postScope(value) {
      try {
        window.webkit.messageHandlers.yggdrasil.postMessage({
          type: 'scope', value: value,
        });
      } catch (e) { /* no-op in standalone preview */ }
    }
    btnBranch.addEventListener('click', () => {
      btnBranch.classList.add('active');
      btnUncommitted.classList.remove('active');
      postScope('branch');
    });
    btnUncommitted.addEventListener('click', () => {
      btnUncommitted.classList.add('active');
      btnBranch.classList.remove('active');
      postScope('uncommitted');
    });

    // Host bridge
    window.yggdrasil = window.yggdrasil || {};
    window.yggdrasil.render = function (diffText) {
      const text = (diffText || '').toString();
      state.diff = parseDiff(text);
      state.tree = buildTree(state.diff);
      state.selected = state.diff[0]?.path || null;
      render();
    };
    window.yggdrasil.clear = function () {
      state.diff = []; state.tree = null; state.selected = null;
      render();
    };
    window.yggdrasil.setTheme = function (theme) {
      if (theme === 'dark' || theme === 'light') {
        document.body.setAttribute('data-theme', theme);
      }
    };
    /// Host-driven scope toggle.
    /// opts = { branchEnabled: boolean, selected: 'branch' | 'uncommitted' }
    window.yggdrasil.setScopeOptions = function (opts) {
      opts = opts || {};
      scopeModes.style.display = opts.branchEnabled ? '' : 'none';
      const sel = opts.selected || 'branch';
      btnBranch.classList.toggle('active', sel === 'branch');
      btnUncommitted.classList.toggle('active', sel === 'uncommitted');
    };

    // OS theme fallback
    (function () {
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.body.setAttribute('data-theme', dark ? 'dark' : 'light');
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        document.body.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      });
    })();
  </script>
</body>
</html>
