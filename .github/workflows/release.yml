name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0) — used in the tag/title if no tag is pushed"
        required: false
        default: ""
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-notarize:
    name: Build / sign / notarize Yggdrasil.app
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode + Swift versions
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
          else
            V="0.0.0-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Install Homebrew deps
        run: |
          brew update
          brew install xcodegen libgit2 create-dmg

      - name: Xcode first-launch
        run: |
          sudo xcodebuild -runFirstLaunch
          # Metal toolchain (`-downloadComponent MetalToolchain`) is Xcode
          # 15.4+; macos-latest's xcodebuild rejects the flag with exit 64.
          # SwiftTerm has a non-Metal fallback, so the toolchain is best-
          # effort — try to download but don't fail the workflow if not.
          sudo xcodebuild -downloadComponent MetalToolchain || true

      - name: Generate Xcode project
        run: make project

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASS }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12
          security find-identity -v -p codesigning build.keychain

      - name: Resolve signing identity
        id: identity
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1)
          if [[ -z "$CERT_INFO" ]]; then
            echo "no Developer ID Application identity found in build.keychain" >&2
            exit 1
          fi
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "identity=$CERT_ID" >> "$GITHUB_OUTPUT"
          echo "Using identity: $CERT_ID"

      - name: Build (Release)
        run: |
          # ARCHS=arm64 because Homebrew ships libgit2 as arm64-only on the
          # macos-latest (Apple Silicon) runner. v0.1.0 got away with the
          # default (arm64 + x86_64) because git_libgit2_version was
          # unreachable and dead-code-stripped; StartupValidator calls it on
          # every launch now, so the x86_64 link needs a libgit2 we don't
          # have. Every Yggdrasil user is on Apple Silicon — Intel isn't a
          # goal.
          xcodebuild \
            -project Yggdrasil.xcodeproj \
            -scheme Yggdrasil \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ steps.identity.outputs.identity }}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            build

      - name: Locate built app
        id: app
        run: |
          APP=$(find build/derived -name "Yggdrasil.app" -path "*/Build/Products/Release/*" -type d | head -1)
          if [[ -z "$APP" ]]; then
            echo "Yggdrasil.app not found under build/derived" >&2
            exit 1
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "$APP"

      - name: Bundle libgit2 into the app
        run: Scripts/bundle-libgit2.sh "${{ steps.app.outputs.path }}"

      - name: Sign + notarize + staple
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.identity.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: Scripts/sign-and-notarize.sh "${{ steps.app.outputs.path }}" Yggdrasil/Yggdrasil.entitlements

      - name: Build DMG
        run: |
          mkdir -p dist
          DMG_PATH="dist/Yggdrasil-${{ steps.ver.outputs.version }}.dmg"
          Scripts/make-dmg.sh "${{ steps.app.outputs.path }}" "$DMG_PATH"

      - name: Sign DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" \
            "dist/Yggdrasil-${{ steps.ver.outputs.version }}.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit \
            "dist/Yggdrasil-${{ steps.ver.outputs.version }}.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "dist/Yggdrasil-${{ steps.ver.outputs.version }}.dmg"

      - name: SHA256
        run: |
          cd dist
          shasum -a 256 *.dmg | tee SHA256SUMS

      - name: Generate Sparkle appcast
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          DMG="dist/Yggdrasil-${VERSION}.dmg"
          APP="${{ steps.app.outputs.path }}"

          # Sparkle CLI tools — pinned in the Makefile (single source of truth,
          # matched to the SPM dependency version).
          make sparkle-tools
          SIGN_UPDATE="$(find .tools -name sign_update -path '*sparkle*' | head -1)"

          # Sign the DMG → EdDSA signature + byte length for the appcast enclosure.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > sparkle_key.txt
          SIG_OUT="$("$SIGN_UPDATE" "$DMG" -f sparkle_key.txt)"
          rm -f sparkle_key.txt
          export ED_SIGNATURE="$(printf '%s' "$SIG_OUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          export DMG_LENGTH="$(printf '%s' "$SIG_OUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')"

          # CFBundleVersion drives Sparkle's update ordering — read it from the
          # built app so the appcast can't drift from the shipped binary.
          export BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          export VERSION
          export DMG_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Yggdrasil-${VERSION}.dmg"
          export RELEASE_NOTES_LINK="https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
          export MIN_SYSTEM="14.0"
          export PUB_DATE="$(date -R)"

          Scripts/generate-appcast.sh > dist/appcast.xml
          echo "=== appcast.xml ===" && cat dist/appcast.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-macos-${{ steps.ver.outputs.version }}
          path: |
            dist/*.dmg
            dist/SHA256SUMS
            dist/appcast.xml

      - name: Create / update GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # Notes come from the body of the tagged commit — the release process
          # puts the changelog in the `chore(release): bump to X.Y.Z` commit, so
          # the published notes are the changelog without a manual step. Set at
          # creation only: a re-run must not clobber notes edited afterwards.
          # HEAD, not "$TAG^{commit}": the checkout is already at the tagged
          # commit, and a shallow fetch may not materialise the tag object —
          # under `set -e` that would fail the step after a 20-minute build.
          NOTES="$(git log -1 --format=%b HEAD)"
          [[ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]] || NOTES="Release $TAG"

          # Create as a draft, upload, and only then publish. `SUFeedURL` is
          # `releases/latest/download/appcast.xml`, so a release that is already
          # published but has no assets yet would make every running client's
          # update check 404 for the length of the upload.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Yggdrasil $TAG" --notes "$NOTES"
          gh release upload "$TAG" dist/*.dmg dist/SHA256SUMS dist/appcast.xml --clobber
          gh release edit "$TAG" --draft=false --latest

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
