name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode + Swift versions
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Install Homebrew deps (xcodegen, swiftlint, swiftformat, libgit2)
        run: |
          brew update
          brew install xcodegen swiftlint swiftformat libgit2

      - name: Xcode first-launch
        run: |
          sudo xcodebuild -runFirstLaunch
          # Metal toolchain download is best-effort — the flag is rejected
          # by older xcodebuild (exit 64). SwiftTerm has a non-Metal path
          # so missing shaders are fine for CI.
          sudo xcodebuild -downloadComponent MetalToolchain || true

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Vendor/Clibgit2/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: make project

      - name: SwiftFormat lint
        # Pin to a known-good SwiftFormat. The GitHub runner image's brew
        # swiftformat (0.61.x) enables newer default rules (numberFormatting,
        # docComments, …) the repo isn't formatted for, so `brew install`'s
        # version would fail on unchanged code. Use a fixed release binary so
        # CI is deterministic regardless of the runner image's bundled version.
        run: |
          SWIFTFORMAT_VERSION=0.60.1
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -oq "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat-bin"
          # Use a fresh cache file (not the shared default) so a stale runner
          # cache can't report unchanged files as needing formatting.
          "$RUNNER_TEMP/swiftformat-bin/swiftformat" . --lint --cache "$RUNNER_TEMP/swiftformat.cache"

      - name: SwiftLint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        env:
          # Optional: when this secret is set in the GitHub repo settings, the
          # integration tests under Tests/Integration/ run against the real
          # GitHub API. When unset, those tests XCTSkip silently.
          YGGDRASIL_TEST_GITHUB_TOKEN: ${{ secrets.YGGDRASIL_TEST_GITHUB_TOKEN }}
        run: make test
