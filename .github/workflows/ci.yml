name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode + Swift versions
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Install Homebrew deps (xcodegen, swiftlint, swiftformat, libgit2)
        run: |
          brew update
          brew install xcodegen swiftlint swiftformat libgit2

      - name: Xcode first-launch
        run: |
          sudo xcodebuild -runFirstLaunch
          # Metal toolchain download is best-effort — the flag is rejected
          # by older xcodebuild (exit 64). SwiftTerm has a non-Metal path
          # so missing shaders are fine for CI.
          sudo xcodebuild -downloadComponent MetalToolchain || true

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Vendor/Clibgit2/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: make project

      - name: SwiftFormat diagnose + capture patch
        run: |
          SWIFTFORMAT_VERSION=0.60.1
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -oq "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat-bin"
          SF="$RUNNER_TEMP/swiftformat-bin/swiftformat"
          echo "===== version ====="; "$SF" --version
          echo "===== git autocrlf / eol ====="; git config --get core.autocrlf || echo "(unset)"; git config --get core.eol || echo "(unset)"
          echo "===== sample file CRLF check ====="; file Yggdrasil/UI/YggdrasilTheme.swift; cat -A Yggdrasil/UI/YggdrasilTheme.swift | sed -n '13p'
          echo "===== format IN PLACE with config ====="
          "$SF" . --config "$GITHUB_WORKSPACE/.swiftformat" --cache ignore || true
          echo "===== diff stat ====="; git diff --stat | tail -30
          git diff > "$RUNNER_TEMP/format.patch" || true
          echo "patch bytes: $(wc -c < "$RUNNER_TEMP/format.patch")"

      - name: Upload format patch
        uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: ${{ runner.temp }}/format.patch
          if-no-files-found: warn

      - name: SwiftLint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        env:
          # Optional: when this secret is set in the GitHub repo settings, the
          # integration tests under Tests/Integration/ run against the real
          # GitHub API. When unset, those tests XCTSkip silently.
          YGGDRASIL_TEST_GITHUB_TOKEN: ${{ secrets.YGGDRASIL_TEST_GITHUB_TOKEN }}
        run: make test
