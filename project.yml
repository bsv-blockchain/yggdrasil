name: Yggdrasil
options:
  bundleIdPrefix: com.bsvassociation
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    GCC_TREAT_WARNINGS_AS_ERRORS: "NO"
configs:
  Debug: debug
  Release: release
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.15.0 is the floor for correct mouse reporting on macOS 26: 1.14.0 fixed
    # the SGR motion→release mis-encoding and the phantom hover clicks
    # (upstream #584), 1.15.0 fixed hover rows ignoring the scroll offset.
    #
    # Pinned to the minor, not the major, because `ClipboardGuardDelegate`
    # forwards a hand-written list of `TerminalViewDelegate` requirements and 5
    # of the 11 have protocol-extension defaults — a member added in a future
    # 1.x would compile clean here and silently stop reaching the view. Bump
    # deliberately, re-checking that list against the protocol.
    minorVersion: "1.15.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"
  Clibgit2:
    path: Vendor/Clibgit2
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.2"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.3"
targets:
  Yggdrasil:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Yggdrasil
        excludes:
          - "**/.gitkeep"
    resources:
      - path: Yggdrasil/Resources/Assets.xcassets
        optional: true
      - path: Yggdrasil/Resources/diff2html
        type: folder
        buildPhase: resources
        optional: true
    info:
      path: Yggdrasil/Info.plist
      properties:
        CFBundleName: Yggdrasil
        CFBundleDisplayName: Yggdrasil
        CFBundleIdentifier: com.bsvassociation.yggdrasil
        CFBundleShortVersionString: "0.5.16"
        CFBundleVersion: "22"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSMainStoryboardFile: ""
        LSApplicationCategoryType: public.app-category.developer-tools
        # Sparkle auto-update. Feed is the latest published release's appcast
        # asset (drafts/prereleases are excluded by GitHub's `latest`); each
        # release ships an appcast.xml describing itself. EdDSA public key is
        # the counterpart of the CI secret SPARKLE_ED_PRIVATE_KEY.
        SUFeedURL: https://github.com/bsv-blockchain/yggdrasil/releases/latest/download/appcast.xml
        SUPublicEDKey: OcdvspJ9ALofqPKnDvemK9MJtQFXy4tAxT3/nRBPInU=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: Yggdrasil/Yggdrasil.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: false
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bsvassociation.yggdrasil
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: "YES"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: GRDB
        product: GRDB
      - package: Clibgit2
        product: Clibgit2
      - package: KeychainAccess
        product: KeychainAccess
      - package: Sparkle
        product: Sparkle

  YggdrasilTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/Unit
        excludes:
          - "Fixtures/**"
      - path: Tests/Unit/Fixtures
        type: folder
        buildPhase: resources
      - path: Tests/Integration
    dependencies:
      - target: Yggdrasil
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.bsvassociation.yggdrasil.unit-tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Yggdrasil.app/Contents/MacOS/Yggdrasil"

schemes:
  Yggdrasil:
    build:
      targets:
        Yggdrasil: all
        YggdrasilTests: [test]
    test:
      targets:
        - YggdrasilTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
